[project]
name = "mosaic-atlas"
version = "0.1.0"
description = "MOSAIC Atlas: an open laboratory for studying populations of AI agents from the inside"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.6", "pyyaml>=6", "numpy>=1.26", "pyarrow>=15", "duckdb>=1.0", "cryptography>=42",
  "fastapi>=0.110", "uvicorn[standard]>=0.29",
  "torch>=2.2", "transformers>=4.50", "tokenizers>=0.19", "safetensors>=0.4", "huggingface_hub>=0.23", "accelerate>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
screenshots = ["playwright>=1.44"]

[project.scripts]
mosaic = "mosaic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mosaic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long acceptance runs"]
